# 동시성 관련 설정 모음 (스레드·커넥션 풀·프로세스 풀을 한곳에서 본다)
spring:
  threads:
    virtual:
      enabled: true # 요청 처리를 가상 스레드로 — 요청 동시성 자체엔 상한이 없어진다

  # 아래 hikari 블록은 maximum-pool-size·minimum-idle 외에는 HikariCP 기본값을 명시만 한 것.
  # 가상 스레드라 실질 처리량은 maximum-pool-size 가 결정한다.
  datasource:
    hikari:
      maximum-pool-size: 10 # 풀이 열어둘 수 있는 최대 커넥션 수 = 실질 DB 동시성 상한
      minimum-idle: 10 # 유지할 최소 유휴 커넥션 — max 와 같게 두어 고정 크기 풀로 동작
      connection-timeout: 30000 # 풀에서 커넥션을 얻지 못하고 기다리는 한계 (30s)
      validation-timeout: 5000 # 빌려주기 전 커넥션 생존 검사 제한 시간 (5s)
      idle-timeout: 600000 # 유휴 커넥션 회수 시한 (10분) — 고정 크기 풀에선 사실상 무효
      max-lifetime: 1800000 # 커넥션 최대 수명 (30분), 지나면 교체
      keepalive-time: 120000 # 유휴 커넥션 주기적 핑 간격 (2분), 중간 방화벽의 끊김 방지
      leak-detection-threshold: 0 # 커넥션 미반납 경고 임계 — 0 은 검사 끔
      initialization-fail-timeout: 1 # 기동 시 첫 커넥션 실패하면 즉시 기동 실패
      auto-commit: true # 빌려준 커넥션의 기본 auto-commit (트랜잭션은 Spring 이 제어)
      read-only: false # 커넥션을 읽기 전용으로 열지 여부
      register-mbeans: false # 풀 상태 JMX MBean 등록 여부 (지표는 Micrometer 로 본다)
      allow-pool-suspension: false # JMX 로 풀을 일시 정지시키는 기능 허용 여부
      isolate-internal-queries: false # 풀 내부 질의를 별도 트랜잭션으로 격리할지 여부

server:
  tomcat:
    max-connections: 8192 # 동시에 수용하는 커넥션 수 (기본값 명시)
    accept-count: 100 # 수용 한도 초과 시 OS 대기 큐 길이 (기본값 명시)

    # 가상 스레드가 켜져 있어 아래 워커 스레드 풀 설정은 적용되지 않는다 (기본값 기록용).
    threads:
      max: 200 # 플랫폼 스레드 모델에서의 최대 워커 스레드 수
      min-spare: 10 # 플랫폼 스레드 모델에서 미리 띄워둘 유휴 워커 수

jodconverter:
  local:
    max-tasks-per-process: 200 # LibreOffice 프로세스 하나가 처리 후 재시작하기까지의 변환 건수

q-asker:
  async:
    task-termination-timeout-ms: 10000 # 종료 시 비동기 태스크가 끝나기를 기다리는 한계 (10s)
    managed-task-termination-timeout-ms: 1200000

  ai:
    concurrency:
      verify: 30 # 생성 게이트 품질 검증의 동시 실행 상한
      regenerate: 30 # 보류 문항 재생성의 동시 실행 상한

---
spring:
  config:
    activate:
      on-profile: local

jodconverter:
  local:
    port-numbers: 2002 # LibreOffice 프로세스 1개 (포트 1개 = 프로세스 1개)

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      keepalive-time: 60000 # 운영은 핑 간격을 1분으로 단축 — 유휴 커넥션 끊김 조기 감지

jodconverter:
  local:
    port-numbers: 2002, 2003 # LibreOffice 프로세스 2개 = 문서 변환 동시성 2
