# 데이터베이스, JPA, 캐시 설정
spring:
  # 아래 hikari 블록은 전부 HikariCP 7.0.2 기본값을 그대로 적어둔 것이다.
  # 동작은 지금과 동일하며, 값을 조정할 때 출발점이 무엇이었는지 보이게 하는 것이 목적.
  # (여기에 없는 connection-test-query·connection-init-sql·transaction-isolation·pool-name의
  #  기본값은 모두 미설정이라 명시할 값이 없다 — JDBC4 isValid 검증, 드라이버 기본 격리수준을 쓴다.)
  datasource:
    hikari:
      # 커넥션 상한. spring.threads.virtual.enabled: true 라 요청 동시성엔 상한이 없으므로,
      # 부하 시 실질 처리량은 이 값이 결정한다.
      maximum-pool-size: 10
      # 기본값은 "maximum-pool-size와 동일"(고정 크기 풀)이다. 여기서 숫자로 박아뒀으므로
      # maximum-pool-size를 올릴 때 이 값도 함께 올려야 같은 성질이 유지된다.
      minimum-idle: 10

      # 커넥션 획득 대기 한도. 풀이 마르면 이 시간 뒤 SQLTransientConnectionException.
      connection-timeout: 30000
      # 커넥션 유효성 검사 자체의 시한.
      validation-timeout: 5000
      # 유휴 커넥션 회수 한도. minimum-idle == maximum-pool-size 인 동안은 회수할 유휴분이
      # 없으므로 동작하지 않는다.
      idle-timeout: 600000
      # 커넥션 최대 수명. DB의 wait_timeout보다 짧게 두어 서버가 먼저 끊는 상황을 피한다.
      max-lifetime: 1800000
      # 유휴 커넥션 핑 주기. 자세한 내용은 아래 prod 오버라이드 참고.
      keepalive-time: 120000

      # 대여 후 반납되지 않는 커넥션 경고 임계. 0이면 누수 탐지를 하지 않는다.
      leak-detection-threshold: 0
      # 기동 시 첫 커넥션 확보 실패를 어떻게 다룰지. 양수면 그 시간만큼 재시도한 뒤 기동 실패.
      initialization-fail-timeout: 1

      auto-commit: true
      read-only: false
      register-mbeans: false
      allow-pool-suspension: false
      isolate-internal-queries: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        # 배치 저장(문항 saveBatch 등) 시 다수 INSERT/UPDATE를 JDBC 배치로 묶어 DB 왕복 감소.
        jdbc:
          batch_size: 30
        order_updates: true
        order_inserts: true

---
spring:
  config:
    activate:
      on-profile: local
  cache:
    type: none
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: prod
  cache:
    type: simple
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 유휴 커넥션을 주기적으로 핑(COM_PING)해 죽었으면 즉시 폐기·재생성한다.
      # 기본값 120000(2분)을 절반으로 줄여, 무트래픽 시간대에 DB가 내려갔을 때의
      # 장애 탐지 지연을 그만큼 좁힌다. 0으로 끄면 풀이 유휴 커넥션의 생사를 감시하지 않아
      # max-lifetime(30분) 로테이션이 그 커넥션을 건드릴 때까지 "정상 보유"로 남는다.
      # 단위는 밀리초(HikariConfig.setKeepaliveTime(long)). 최소 허용값 30000,
      # max-lifetime보다 작아야 하며 검사 시한은 validation-timeout(5s)을 따른다.
      keepalive-time: 60000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
