# Q-Asker 애플리케이션 공통 설정
q-asker:
  hashid:
    min-length: 8
  async:
    task-termination-timeout-ms: 10000
  sse:
    # emitter 절대 시한. 최악 정상 생성(30문항=청크 2회 × gemini-http.call-timeout 300s + 보류 재생성 1콜 300s)을 커버
    # — ai-setting.yml call-timeout 변경 시 함께 재산정
    timeout-ms: 900000

  # 파일 업로드 검증
  file-validation:
    max-file-name-length: 255
    allowed-extensions: application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-powerpoint
    max-file-size: 52_428_800

  # 관리자 이미지 업로드 검증 (문서 업로드와 규칙이 달라 분리)
  admin:
    image-upload:
      max-size: 5_242_880 # 5MB
      allowed-types: image/jpeg,image/png,image/gif,image/webp

server:
  shutdown: graceful

  # 아래 tomcat 블록은 전부 Spring Boot 4.1.0 / Tomcat 11.0.22 기본값을 그대로 적어둔 것이다.
  # 동작은 지금과 동일하며, 값을 조정할 때 출발점이 무엇이었는지 보이게 하는 것이 목적.
  tomcat:
    # 동시에 수용하는 소켓 커넥션 상한. 초과분은 accept-count 백로그에 쌓이고,
    # 그마저 차면 OS가 연결을 거부한다.
    max-connections: 8192
    accept-count: 100

    threads:
      # spring.threads.virtual.enabled: true 이면 Boot가 커넥터 executor를 가상 스레드로 교체하므로
      # 이 두 값은 적용되지 않는다. 가상 스레드를 끄는 순간 되살아난다.
      max: 200
      min-spare: 10

    # Boot는 이 둘을 설정하지 않고 Tomcat 기본값에 맡긴다(둘 다 60s).
    # keep-alive-timeout은 미지정 시 connection-timeout을 따라가므로 함께 움직인다.
    connection-timeout: 60s
    keep-alive-timeout: 60s
    max-keep-alive-requests: 100

    max-http-form-post-size: 2MB
    max-http-response-header-size: 8KB
    max-swallow-size: 2MB
    max-parameter-count: 1000
    max-part-count: 50
    max-part-header-size: 512B

    processor-cache: 200
    background-processor-delay: 10s
    uri-encoding: UTF-8

spring:
  lifecycle:
    timeout-per-shutdown-phase: 300s

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 0

  threads:
    virtual:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: local

q-asker:
  slack:
    enabled: false
  web:
    frontend-deploy-url: http://localhost:5173

---
spring:
  config:
    activate:
      on-profile: prod

q-asker:
  slack:
    enabled: true
  web:
    frontend-deploy-url: https://www.q-asker.com
