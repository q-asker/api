# JODConverter (LibreOffice 기반 문서 변환) 설정
# 프로세스 풀 크기(port-numbers·max-tasks-per-process)는 threads.yml 로 이관 — 여기는 시한만 둔다.
jodconverter:
  local:
    task-execution-timeout: 60000
    task-queue-timeout: 120000

---
spring:
  config:
    activate:
      on-profile: local

jodconverter:
  local:
    enabled: false
    office-home: /Applications/LibreOffice.app/Contents

---
spring:
  config:
    activate:
      on-profile: prod

jodconverter:
  local:
    enabled: true
    office-home: /usr/lib/libreoffice
